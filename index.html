<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Memorial Descritivo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#0066FF',
                        'brand-navy': '#1A3666',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- CARTÃO DE LOGIN -->
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-md w-full p-8 text-center relative overflow-hidden">
        
        <!-- Elemento Decorativo -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-brand-blue/10 rounded-full blur-2xl"></div>

        <!-- Logo e Título -->
        <img src="channels4_profile-removebg-preview.png" alt="Logo UniFECAF" class="w-20 h-20 mx-auto mb-4 object-contain">
        <h2 class="text-2xl font-black text-slate-800 tracking-tight">Memorial Descritivo</h2>
        <p class="text-sm text-slate-500 mt-1 mb-8">Selecione seu tipo de acesso para continuar</p>

        <!-- SELEÇÃO DE PERFIL -->
        <div id="profileSelection" class="grid grid-cols-2 gap-4">
            <!-- Botão POLOS -->
            <button type="button" onclick="accessPolo()" 
                class="group p-5 bg-slate-50 hover:bg-brand-blue/5 border-2 border-slate-200 hover:border-brand-blue rounded-2xl transition-all flex flex-col items-center gap-3 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-blue-100 text-brand-blue flex items-center justify-center group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <span class="font-extrabold text-sm text-slate-700 group-hover:text-brand-blue">Polos</span>
            </button>

            <!-- Botão ADM -->
            <button type="button" onclick="showAdmInput()" 
                class="group p-5 bg-slate-50 hover:bg-brand-navy/5 border-2 border-slate-200 hover:border-brand-navy rounded-2xl transition-all flex flex-col items-center gap-3 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-slate-200 text-brand-navy flex items-center justify-center group-hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <span class="font-extrabold text-sm text-slate-700 group-hover:text-brand-navy">Administração</span>
            </button>
        </div>

        <!-- FORMULÁRIO DE SENHA ADM -->
        <div id="admPasswordArea" class="hidden space-y-4">
            <div class="text-left">
                <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Senha de Acesso ADM</label>
                <input type="password" id="admPasswordInput" placeholder="Digite a senha..." 
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:bg-white focus:border-brand-blue focus:outline-none">
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="hideAdmInput()" class="w-1/2 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-sm transition-all cursor-pointer">Voltar</button>
                <button type="button" onclick="validateAdmPassword()" class="w-1/2 py-3 bg-brand-navy hover:bg-slate-900 text-white rounded-xl font-bold text-sm transition-all shadow-md cursor-pointer">Acessar</button>
            </div>
        </div>

    </div>

    <script>
        const ADM_PASSWORD = "admin123";

        function accessPolo() {
            Swal.fire({
                title: 'Acompanhamento do Memorial',
                text: 'Informe seu e-mail para receber as notificações de aprovação ou reprovação do seu polo.',
                input: 'email',
                inputPlaceholder: 'exemplo@unifecaf.com.br',
                showCancelButton: true,
                confirmButtonText: 'Acessar Formulário',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#0066FF',
                cancelButtonColor: '#64748b',
                customClass: {
                    popup: 'rounded-2xl',
                    confirmButton: 'px-5 py-2.5 rounded-xl font-bold text-sm',
                    cancelButton: 'px-5 py-2.5 rounded-xl font-bold text-sm',
                    input: 'rounded-xl text-sm'
                },
                inputValidator: (value) => {
                    if (!value) {
                        return 'Por favor, informe um e-mail válido para continuar!';
                    }
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(value)) {
                        return 'Por favor, insira um formato de e-mail válido.';
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.setItem('userProfile', 'polo');
                    localStorage.setItem('emailUsuarioPolo', result.value.trim());
                    window.location.href = 'index.html';
                }
            });
        }

        function showAdmInput() {
            document.getElementById('profileSelection').classList.add('hidden');
            document.getElementById('admPasswordArea').classList.remove('hidden');
            document.getElementById('admPasswordInput').focus();
        }

        function hideAdmInput() {
            document.getElementById('admPasswordArea').classList.add('hidden');
            document.getElementById('profileSelection').classList.remove('hidden');
            document.getElementById('admPasswordInput').value = '';
        }

        function validateAdmPassword() {
            const inputPass = document.getElementById('admPasswordInput').value;

            if (inputPass === ADM_PASSWORD) {
                localStorage.setItem('userProfile', 'adm');
                window.location.href = 'dashboard-adm.html';
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Senha Incorreta',
                    text: 'Por favor, tente novamente.',
                    confirmButtonColor: '#1A3666'
                });
            }
        }
    </script>
</body>
</html>
